        <h1>Amanchi Labs: Privacy-First Software Studio</h1>
        <p>We develop intelligent, local-first personal applications with privacy and user control as design principles. Our goal is on-device processing without requiring personal documents to be uploaded to Amanchi Labs servers. Our focus is software development and information technology.</p>
        <h2>Your life is personal. Your technology should respect that.</h2>
        <p>Private by Design. Local by Default. Your Data. Your Device. Your Control. These express our design philosophy; features and data-handling practices vary by product.</p>
        <p>Local-first by design. AI-enabled by choice. We design optional external AI integrations around user-initiated requests. External providers may process or retain submitted information under their own policies.</p>
        <h2>Our applications</h2>
        <p>WealthPrivate is in development for personal financial documents and history. DermaPrivate explores skincare planning and personal routines.</p>
